openapi: 3.0.3
info:
  title: Tenancy Management System API
  description: API for managing tenants in the Tenancy Management System
  version: 1.0.0
servers:
  - url: http://localhost:4144
    description: Local dev server

paths:
  /v1/tenants:
    post:
      summary: Create a new tenant
      description: Creates a new tenant in the system.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTenantRequest'
      responses:
        '201':
          description: Tenant successfully created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateTenantResponse'
        '400':
          description: Invalid input (e.g., missing required fields, exceeding length limits).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequestResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerErrorResponse'

  /v1/tenants/{tenantId}/users:
    post:
      summary: Add a user to a tenant
      description: Adds a user to a tenant.
      parameters:
        - name: tenantId
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: The unique identifier of the tenant.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddUserToTenantRequest'
      responses:
        '201':
          description: User successfully added to the tenant.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AddUserToTenantResponse'
        '400':
          description: Invalid input (e.g., missing required fields, exceeding length limits).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequestResponse'
        '409':
          description: Conflict with existing resource - ex - a user is already added to a tenant
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConflictErrorResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerErrorResponse'

  /v1/users/{ssoUserId}/tenants:
    get:
      summary: Get tenants associated with a user
      description: Retrieves a list of tenants associated with a user.
      parameters:
        - ssoUserId:
          in: path
          required: true
          schema:
            type: string
          description: The unique SSO user ID of the user.
      responses:
        '200':
          description: List of tenants associated with the user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetUserTenantsResponse'

components:
  schemas:
    CreateTenantRequest:
      type: object
      required:
        - name
        - ministryName
        - user
      properties:
        name:
          type: string
          description: The name of the tenant.
          minLength: 1
          maxLength: 30
          example: "Roads initiative"
        ministryName:
          type: string
          description: The name of the ministry associated with the tenant.
          minLength: 1
          maxLength: 100
          example: "Ministry of Natural Resources"
        user:
          $ref: '#/components/schemas/User'

    User:
      type: object
      required:
        - firstName
        - lastName
        - displayName
        - userName
        - ssoUserId
        - email
      properties:
        firstName:
          type: string
          description: The first name of the user.
          minLength: 1
          maxLength: 50
          example: "Shankar"
        lastName:
          type: string
          description: The last name of the user.
          minLength: 1
          maxLength: 50
          example: "Sethuraman"
        displayName:
          type: string
          description: The display name of the user in full.
          minLength: 1
          maxLength: 50
          example: "Sethuraman, Shankar: JEDI: EX"
        userName:
          type: string
          description: The IDIR username of the user.
          minLength: 1
          maxLength: 50
          example: "SSETHURA"
        ssoUserId:
          type: string
          description: The SSO user ID associated with the user.
          format: uuid
          example: "fd33f1cef7ca4b19a71104d4ecf7066b"
        email:
          type: string
          format: email
          description: The email address of the user.
          example: "shankar@gov.bc.ca"

    Role:
      type: object           
      properties:
        id:
          type: string
          description: The role ID as set in the database.
          format: uuid
        name:
          type: string
          minLength: 1
          maxLength: 100
          description: Name of the role
          example: "CHEFS.SUBMITTER"
        description:
          type: string
          minLength: 1
          maxLength: 255
          description: Description of the role
          example: "CHEFS submitter role"
        createdDateTime:
          type: string
          format: date-time
          example: "2025-02-26T01:28:52.693Z"
        updatedDateTime:
          type: string
          format: date-time
          example: "2025-02-26T01:28:52.693Z"

    AddUserToTenantRequest:
      type: object
      required:
        - user
      properties:
        user:
          $ref: '#/components/schemas/User'
        role:
          type: object
          description: Optional role for the user.
          properties:
            id:
              type: string
              format: uuid
              example: "14c6bb48-54e2-4ce0-9bbd-af4982fff13b"
          required:
            - id

    CreateTenantResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            tenant:
              $ref: '#/components/schemas/TenantWithUsers'

    Tenant:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: "f98cbbfb-b96c-4a40-a10b-c2a7e795022c"
        name:
          type: string
          example: "New Tenant3"
        ministryName:
          type: string
          example: "New Ministry"
        createdDateTime:
          type: string
          format: date-time
          example: "2025-03-11T03:01:23.697Z"
        updatedDateTime:
          type: string
          format: date-time
          example: "2025-03-11T03:01:23.697Z"

    TenantWithUsers:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: "f98cbbfb-b96c-4a40-a10b-c2a7e795022c"
        name:
          type: string
          example: "New Tenant3"
        ministryName:
          type: string
          example: "New Ministry"
        createdDateTime:
          type: string
          format: date-time
          example: "2025-03-11T03:01:23.697Z"
        updatedDateTime:
          type: string
          format: date-time
          example: "2025-03-11T03:01:23.697Z"
        users:
          type: array
          items:
            $ref: '#/components/schemas/User'

    AddUserToTenantResponse:
      type: object
      properties:
        user:
          $ref: '#/components/schemas/User'
        role:
          $ref: '#/components/schemas/Role'

    BadRequestResponse:
      type: object
      properties:
        name:
          type: string
          description: A brief description of the error.
          example: "Error occurred during tenant creation"
        message:
          type: string
          description: A more detailed explanation of the error.
          example: "This is my error message detail"
        httpResponseCode:
          type: integer
          description: HTTP status code.
          example: 400
        errorMessage:
          type: string
          description: A high-level error message.
          example: "Internal Server Error"

    GetUserTenantsResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            tenants:
              type: array
              items:
                $ref: '#/components/schemas/Tenant'

    InternalServerErrorResponse:
       type: object
       properties:
        name:
          type: string
          description: A brief description of the error.
          example: "Error occurred during tenant creation"
        message:
          type: string
          description: A more detailed explanation of the error.
          example: "This is an error message"
        httpResponseCode:
          type: integer
          description: HTTP status code.
          example: 500
        errorMessage:
          type: string
          description: A high-level error message.
          example: "Internal Server Error"

    ConflictErrorResponse:
       type: object
       properties:
        name:
          type: string
          description: A brief description of the error.
          example: "Error occurred adding user to the tenant"
        message:
          type: string
          description: A more detailed explanation of the error.
          example: "User is already added to this tenant: 8821eb86-9cf5-40a3-9a0d-81b551f50a2f"
        httpResponseCode:
          type: integer
          description: HTTP status code.
          example: 409
        errorMessage:
          type: string
          description: A high-level error message.
          example: "Conflict"
