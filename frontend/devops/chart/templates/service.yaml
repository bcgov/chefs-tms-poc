apiVersion: v1
kind: Service
metadata:
  name: {{ include "tms-frontend.fullname" . }}
  labels:
    {{- include "tms-frontend.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}
  selector:
    {{- include "tms-frontend.selectorLabels" . | nindent 6 }}
