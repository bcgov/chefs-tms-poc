replicaCount: 1

image:
  repository: image-registry.apps.silver.devops.gov.bc.ca/a191b5-tools/tms-frontend
  tag: latest
  pullPolicy: Always

service:
  type: ClusterIP
  port: 80
  targetPort: 4173

allowedHosts: ""
backendApiUrl: ""

env:
  - name: VITE_KEYCLOAK_URL
    valueFrom:
      secretKeyRef:
        name: tms-frontend-secrets
        key: VITE_KEYCLOAK_URL
  - name: VITE_KEYCLOAK_REALM
    valueFrom:
      secretKeyRef:
        name: tms-frontend-secrets
        key: VITE_KEYCLOAK_REALM
  - name: VITE_KEYCLOAK_CLIENT_ID
    valueFrom:
      secretKeyRef:
        name: tms-frontend-secrets
        key: VITE_KEYCLOAK_CLIENT_ID
  - name: VITE_KEYCLOAK_LOGOUT_URL
    valueFrom:
      secretKeyRef:
        name: tms-frontend-secrets
        key: VITE_KEYCLOAK_LOGOUT_URL
  - name: VITE_ALLOWED_HOSTS
    valueFrom:
      secretKeyRef:
        name: tms-frontend-secrets
        key: VITE_ALLOWED_HOSTS
  - name: VITE_BACKEND_API_URL
    valueFrom:
      secretKeyRef:
        name: tms-frontend-secrets
        key: VITE_BACKEND_API_URL
